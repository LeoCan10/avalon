<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14110f" />
<title>Avalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #14110f; --panel: #1f1a16; --panel2: #2a231d; --line: #3a3029;
    --text: #efe6d8; --muted: #a8998a; --gold: #d9a441;
    --good: #4f8fd6; --good-bg: #16273a; --evil: #d0453f; --evil-bg: #3a1716;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 Inter, system-ui, sans-serif; }
  body { min-height: 100dvh; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 120px; }
  h1, h2, h3, .serif { font-family: Cinzel, Georgia, serif; letter-spacing: .03em; }
  h1 { font-size: 40px; text-align: center; margin: 32px 0 4px; color: var(--gold); }
  h2 { font-size: 20px; margin: 20px 0 10px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 12px 0; }
  input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 17px; }
  input:focus { outline: 2px solid var(--gold); border-color: transparent; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 14px 16px; cursor: pointer; color: var(--text); background: var(--panel2); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-gold { background: var(--gold); color: #1a1208; border-color: var(--gold); }
  .btn-good { background: var(--good); border-color: var(--good); }
  .btn-evil { background: var(--evil); border-color: var(--evil); }
  .full { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .center { text-align: center; }
  .code { font-family: Cinzel, serif; font-size: 44px; letter-spacing: .25em; text-align: center; color: var(--gold); }
  .players { list-style: none; padding: 0; margin: 0; }
  .players li { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1px solid transparent; }
  .players li + li { margin-top: 4px; }
  .players li.sel { border-color: var(--gold); background: #2d2415; }
  .players li.clickable { cursor: pointer; background: var(--panel2); }
  .players .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #5c8a4d; flex: none; }
  .dot.off { background: #555; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.gold { color: var(--gold); border-color: #6b5326; }
  .tag.good { color: #9cc4f0; border-color: #2f5179; background: var(--good-bg); }
  .tag.evil { color: #f09a96; border-color: #7a2c29; background: var(--evil-bg); }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .toggle + .toggle { border-top: 1px solid var(--line); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: #3a332c; border-radius: 99px; transition: .2s; }
  .switch span::after { content: ''; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #ddd; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: var(--gold); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .quests { display: flex; justify-content: space-between; gap: 6px; }
  .quest { flex: 1; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Cinzel, serif; font-size: 20px; position: relative; max-width: 64px; }
  .quest.cur { border-color: var(--gold); box-shadow: 0 0 0 3px #d9a44133; }
  .quest.ok { background: var(--good); border-color: var(--good); }
  .quest.ko { background: var(--evil); border-color: var(--evil); }
  .quest small { font-family: Inter; font-size: 9px; position: absolute; bottom: 6px; color: var(--muted); }
  .quest.ok small, .quest.ko small { color: #fff; }
  .rej { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 12px; }
  .rej i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: block; }
  .rej i.on { background: var(--evil); border-color: var(--evil); }
  .role-card { text-align: center; padding: 22px 16px; border-radius: 14px; cursor: pointer; user-select: none; }
  .role-card.good { background: var(--good-bg); border: 1px solid #2f5179; }
  .role-card.evil { background: var(--evil-bg); border: 1px solid #7a2c29; }
  .role-card.hidden { background: var(--panel); border: 1px dashed var(--line); }
  .role-name { font-family: Cinzel, serif; font-size: 26px; font-weight: 800; }
  .fab { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .fab .inner { max-width: 520px; margin: 0 auto; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--evil); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 10; max-width: 90vw; box-shadow: 0 6px 20px #0008; }
  .banner { text-align: center; padding: 14px; border-radius: 12px; font-weight: 600; }
  .banner.good { background: var(--good-bg); color: #b8d6f5; }
  .banner.evil { background: var(--evil-bg); color: #f5bab7; }
  .vote-grid { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .big-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .big-choice button { padding: 28px 10px; font-size: 18px; font-family: Cinzel, serif; }
  a { color: var(--gold); }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="fab"></div>
<script>
const $app = document.getElementById('app');
const $fab = document.getElementById('fab');

const ROLE_INFO = {
  merlin: 'Conocés a los malvados (menos a Mordred). Guiá a los leales sin que el Asesino te descubra.',
  percival: 'Sabés quién es Merlín… pero Morgana puede hacerse pasar por él.',
  servant: 'No sabés nada. Descubrí a los traidores con la conversación y los votos.',
  assassin: 'Si el bien gana 3 misiones, tenés una última chance: adivinar quién es Merlín.',
  morgana: 'Te hacés pasar por Merlín ante Percival.',
  mordred: 'Merlín no sabe que sos malvado.',
  oberon: 'Sos malvado, pero no conocés a tus compañeros y ellos no te conocen.',
  minion: 'Conocés a tus compañeros malvados. Saboteá las misiones sin que te descubran.',
};
const ROLE_NAMES = { merlin: 'Merlín', percival: 'Percival', servant: 'Leal servidor', assassin: 'Asesino', morgana: 'Morgana', mordred: 'Mordred', oberon: 'Oberón', minion: 'Esbirro' };
const EVIL_COUNT = { 5: 2, 6: 2, 7: 3, 8: 3, 9: 3, 10: 4 };

let S = null;               // estado de la sala
let selected = new Set();   // selección local (equipo / objetivo)
let roleShown = false;
let lastPhaseKey = '';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameOf = (id) => esc(S.players.find((p) => p.id === id)?.name ?? '¿?');

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---- Comunicación con el servidor (acciones por POST + consulta periódica) ----
const POLL_MS = 1500;
let busy = false;

function applyState(s) {
  if (S && s.ver < S.ver) return; // respuesta vieja que llegó tarde
  const key = s.game ? s.game.phase + s.game.questIdx + s.game.leader + s.game.rejections : 'lobby';
  if (key !== lastPhaseKey) { selected = new Set(); lastPhaseKey = key; }
  if (!s.game) roleShown = false;
  S = s; render();
}

function forgetRoom(msg) {
  store.del('avalon.code'); store.del('avalon.token'); S = null;
  history.replaceState(null, '', '/');
  if (msg) toast(msg);
  render();
}

const ARG = { setOptions: 'options', kick: 'target', vote: 'approve', questCard: 'success', propose: 'team', assassinate: 'target' };
const socket = {
  async emit(action, arg) {
    if (busy) return;
    busy = true;
    const payload = ARG[action] ? { [ARG[action]]: arg } : { ...(arg || {}) };
    try {
      const r = await fetch('/api/room', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, code: S?.code ?? payload.code, token: store.get('avalon.token'), ...payload }),
      });
      const data = await r.json();
      if (!r.ok) return toast(data.error || 'Error');
      if (data.token) {
        store.set('avalon.code', data.state.code); store.set('avalon.token', data.token);
        history.replaceState(null, '', '?sala=' + data.state.code);
      }
      if (data.state) applyState(data.state);
    } catch { toast('Sin conexión, probá de nuevo'); }
    finally { busy = false; }
  },
};

async function poll() {
  const code = store.get('avalon.code'), token = store.get('avalon.token');
  if (!code || !token || document.hidden) return;
  try {
    const r = await fetch(`/api/room?code=${encodeURIComponent(code)}&token=${encodeURIComponent(token)}&ver=${S ? S.ver : ''}`);
    const data = await r.json();
    if (r.status === 410) return forgetRoom(S ? 'Te sacaron de la sala' : null);
    if (!r.ok) { if (data.error === 'No existe esa sala') forgetRoom(S ? 'La sala expiró' : null); return; }
    if (!data.same) applyState(data);
  } catch {}
}
setInterval(poll, POLL_MS);
document.addEventListener('visibilitychange', poll);
poll();

// ---- Render ----
function render() {
  $fab.innerHTML = '';
  if (!S) return renderHome();
  if (!S.game) return renderLobby();
  renderGame();
}

function setFab(html) { $fab.innerHTML = `<div class="fab"><div class="inner">${html}</div></div>`; }

function renderHome() {
  const params = new URLSearchParams(location.search);
  const code = (params.get('sala') || '').toUpperCase();
  const name = store.get('avalon.name') || '';
  $app.innerHTML = `
    <h1>Avalon</h1>
    <div class="sub">Lealtad y traición en la corte del Rey Arturo</div>
    <div class="card stack">
      <input id="name" placeholder="Tu nombre" maxlength="20" value="${esc(name)}" autocomplete="off" />
    </div>
    <div class="card stack">
      <h2 style="margin-top:0">Unirse a una sala</h2>
      <input id="code" placeholder="Código (ej: KQRT)" maxlength="4" value="${esc(code)}" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em" />
      <button class="btn-gold full" id="join">Entrar</button>
    </div>
    <div class="center muted" style="margin:16px 0">o</div>
    <button class="full" id="create">Crear sala nueva</button>
    <details class="card" style="margin-top:28px"><summary>¿Cómo se juega?</summary>${rulesHtml()}</details>`;
  const getName = () => { const n = document.getElementById('name').value.trim(); store.set('avalon.name', n); return n; };
  document.getElementById('join').onclick = () => socket.emit('join', { name: getName(), code: document.getElementById('code').value });
  document.getElementById('create').onclick = () => socket.emit('create', { name: getName() });
}

function rulesHtml() {
  return `<div class="small stack" style="margin-top:10px">
    <p>Los jugadores se dividen en <b style="color:#9cc4f0">leales a Arturo</b> y <b style="color:#f09a96">secuaces de Mordred</b>. Los malvados se conocen entre sí; los leales no saben nada (salvo Merlín).</p>
    <p>Hay 5 misiones. En cada ronda el líder propone un equipo y todos votan. Si la mayoría aprueba, el equipo va a la misión; si no, el liderazgo pasa al siguiente. <b>5 rechazos seguidos = gana el mal.</b></p>
    <p>En la misión, cada integrante juega en secreto Éxito o Fracaso. Los leales sólo pueden jugar Éxito. Con un Fracaso la misión falla (en la 4ª misión con 7+ jugadores hacen falta dos).</p>
    <p>El primer bando en sumar 3 misiones gana… pero si gana el bien, el Asesino tiene una última chance: si adivina quién es Merlín, gana el mal.</p></div>`;
}

function playerRow(p, extra = '', cls = '') {
  return `<li class="${cls}" data-id="${p.id}"><span class="name">${esc(p.name)}${p.id === S.meId ? ' <span class="muted">(vos)</span>' : ''}</span>${extra}</li>`;
}

function renderLobby() {
  const isHost = S.hostId === S.meId;
  const n = S.players.length;
  const o = S.options;
  const evilN = EVIL_COUNT[Math.min(Math.max(n, 5), 10)];
  const link = location.origin + '/?sala=' + S.code;
  const opt = (k, label, desc) => `
    <label class="toggle"><div><div>${label}</div><div class="small muted">${desc}</div></div>
    <span class="switch"><input type="checkbox" data-opt="${k}" ${o[k] ? 'checked' : ''} ${isHost ? '' : 'disabled'}><span></span></span></label>`;
  $app.innerHTML = `
    <div class="card center">
      <div class="muted small">Código de la sala</div>
      <div class="code">${S.code}</div>
      <button id="share" class="full" style="margin-top:8px">Compartir link</button>
    </div>
    <h2>Jugadores <span class="muted">${n}/10</span></h2>
    <div class="card"><ul class="players">${S.players.map((p) => playerRow(p,
      (p.id === S.hostId ? '<span class="tag gold">anfitrión</span>' : '') +
      (isHost && p.id !== S.meId ? `<button class="small" data-kick="${p.id}" style="padding:4px 10px">✕</button>` : ''))).join('')}</ul>
      ${n < 5 ? `<div class="small muted center" style="margin-top:10px">Faltan ${5 - n} para poder empezar</div>` : ''}
    </div>
    <h2>Personajes</h2>
    <div class="card">
      <div class="small muted" style="margin-bottom:6px">Siempre: Merlín y Asesino. Con ${n >= 5 ? n : 5} jugadores: ${evilN} malvados.</div>
      ${opt('percival', 'Percival', 'Ve a Merlín (y a Morgana si está)')}
      ${opt('morgana', 'Morgana', 'Confunde a Percival')}
      ${opt('mordred', 'Mordred', 'Invisible para Merlín')}
      ${opt('oberon', 'Oberón', 'Malvado solitario')}
      ${!isHost ? '<div class="small muted">Sólo el anfitrión cambia esto.</div>' : ''}
    </div>
    <details class="card"><summary>¿Cómo se juega?</summary>${rulesHtml()}</details>
    <button id="leave" class="full" style="margin-top:8px">Salir de la sala</button>`;
  if (isHost) setFab(`<button class="btn-gold full" id="start" ${n < 5 || n > 10 ? 'disabled' : ''}>Empezar partida</button>`);
  else setFab(`<div class="center muted">Esperando que el anfitrión empiece…</div>`);

  document.getElementById('share').onclick = async () => {
    try { if (navigator.share) await navigator.share({ title: 'Avalon', text: `Sumate a Avalon, sala ${S.code}`, url: link }); else { await navigator.clipboard.writeText(link); toast('Link copiado'); } } catch {}
  };
  document.querySelectorAll('[data-opt]').forEach((el) => el.onchange = () => socket.emit('setOptions', { [el.dataset.opt]: el.checked }));
  document.querySelectorAll('[data-kick]').forEach((el) => el.onclick = () => socket.emit('kick', el.dataset.kick));
  document.getElementById('leave').onclick = async () => { await socket.emit('leave'); forgetRoom(); };
  const st = document.getElementById('start'); if (st) st.onclick = () => socket.emit('start');
}

function boardHtml(g) {
  const quests = g.questSizes.map((size, i) => {
    const r = g.results[i];
    const cls = r ? (r.success ? 'ok' : 'ko') : i === g.questIdx && g.phase !== 'end' && g.phase !== 'assassin' ? 'cur' : '';
    return `<div class="quest ${cls}">${r ? (r.success ? '✓' : '✗') : size}${g.failsNeeded[i] > 1 ? '<small>2 ✗</small>' : ''}</div>`;
  }).join('');
  const rej = [0, 1, 2, 3, 4].map((i) => `<i class="${i < g.rejections ? 'on' : ''}"></i>`).join('');
  return `<div class="card"><div class="quests">${quests}</div>
    <div class="rej"><span class="small muted" style="margin-right:6px">Rechazos</span>${rej}</div></div>`;
}

function roleHtml(g) {
  const me = g.me;
  if (!me) return '';
  if (!roleShown) return `<div class="role-card hidden" id="role"><div class="serif" style="font-size:18px">Tocá para ver tu personaje</div><div class="small muted">Que nadie mire tu pantalla</div></div>`;
  const night = me.night ? `<div style="margin-top:12px"><div class="small muted">${esc(me.night.label)}:</div><div style="font-weight:600;margin-top:4px">${me.night.ids.length ? me.night.ids.map(nameOf).join(', ') : '—'}</div></div>` : '';
  return `<div class="role-card ${me.team}" id="role">
    <div class="small muted">${me.team === 'good' ? 'Leal a Arturo' : 'Secuaz de Mordred'}</div>
    <div class="role-name">${esc(me.roleName)}</div>
    <div class="small" style="margin-top:6px">${ROLE_INFO[me.role]}</div>${night}
    <div class="small muted" style="margin-top:12px">Tocá para ocultar</div></div>`;
}

function renderGame() {
  const g = S.game;
  const isLeader = g.leader === S.meId;
  const byId = Object.fromEntries(S.players.map((p) => [p.id, p]));
  let phaseHtml = '';
  let listMode = null; // 'team' | 'assassin'

  const lastVoteHtml = () => {
    const lv = g.lastVote;
    if (!lv) return '';
    return `<details class="card"><summary>Última votación: ${lv.approved ? 'aprobada' : 'rechazada'} (equipo de ${nameOf(lv.leader)})</summary>
      <div class="small muted" style="margin:8px 0">Equipo: ${lv.team.map(nameOf).join(', ')}</div>
      <div class="vote-grid">${g.order.map((id) => `<span>${nameOf(id)}</span><span class="tag ${lv.votes[id] ? 'good' : 'evil'}">${lv.votes[id] ? 'Aprueba' : 'Rechaza'}</span>`).join('')}</div></details>`;
  };

  const lastQuest = g.results[g.results.length - 1];
  const lastQuestHtml = lastQuest && (g.phase === 'team' || g.phase === 'assassin') && g.lastVote?.quest === g.results.length - 1
    ? `<div class="banner ${lastQuest.success ? 'good' : 'evil'}">Misión ${g.results.length}: ${lastQuest.success ? 'ÉXITO' : 'FRACASO'} · ${lastQuest.fails} carta${lastQuest.fails === 1 ? '' : 's'} de fracaso</div>` : '';

  switch (g.phase) {
    case 'team': {
      const size = g.questSizes[g.questIdx];
      phaseHtml = `<h2>Misión ${g.questIdx + 1} · equipo de ${size}</h2>
        <div class="muted">${isLeader ? `Sos el líder. Elegí ${size} jugadores.` : `${nameOf(g.leader)} está armando el equipo.`}</div>`;
      if (isLeader) {
        listMode = 'team';
        setFab(`<button class="btn-gold full" id="propose" ${selected.size !== size ? 'disabled' : ''}>Proponer equipo (${selected.size}/${size})</button>`);
      }
      break;
    }
    case 'vote': {
      phaseHtml = `<h2>Votación</h2><div class="muted">${nameOf(g.leader)} propone: <b style="color:var(--text)">${g.team.map(nameOf).join(', ')}</b></div>
        <div class="small muted" style="margin-top:6px">Votaron ${g.votedIds.length}/${g.order.length}${g.rejections === 4 ? ' · <b style="color:var(--evil)">¡Si se rechaza, gana el mal!</b>' : ''}</div>`;
      if (g.myVote === null) setFab(`<div class="big-choice"><button class="btn-good" data-vote="1">Aprobar</button><button class="btn-evil" data-vote="0">Rechazar</button></div>`);
      else setFab(`<div class="center muted">Votaste <b>${g.myVote ? 'Aprobar' : 'Rechazar'}</b>. Esperando al resto…</div>`);
      break;
    }
    case 'quest': {
      const inTeam = g.team.includes(S.meId);
      phaseHtml = `<h2>Misión ${g.questIdx + 1} en curso</h2><div class="muted">Equipo: ${g.team.map(nameOf).join(', ')}</div>
        <div class="small muted" style="margin-top:6px">Cartas jugadas ${g.playedIds.length}/${g.team.length}</div>`;
      if (inTeam && !g.myCardPlayed) {
        const good = g.me.team === 'good';
        setFab(`<div class="small muted center" style="margin-bottom:8px">Elegí en secreto${good ? ' (los leales sólo pueden jugar Éxito)' : ''}</div>
          <div class="big-choice"><button class="btn-good" data-card="1">Éxito</button><button class="btn-evil" data-card="0" ${good ? 'disabled' : ''}>Fracaso</button></div>`);
      } else if (inTeam) setFab(`<div class="center muted">Carta jugada. Esperando al resto del equipo…</div>`);
      break;
    }
    case 'assassin': {
      const amAssassin = g.me?.role === 'assassin';
      phaseHtml = `<h2>¡El bien ganó 3 misiones!</h2><div class="muted">${nameOf(g.assassin)} es el Asesino. Los malvados pueden debatir en voz alta; el Asesino elige quién cree que es Merlín.</div>`;
      if (amAssassin) {
        listMode = 'assassin';
        setFab(`<button class="btn-evil full" id="kill" ${selected.size !== 1 ? 'disabled' : ''}>Asesinar${selected.size ? ' a ' + nameOf([...selected][0]) : ''}</button>`);
      }
      break;
    }
    case 'end': {
      const isHost = S.hostId === S.meId;
      phaseHtml = `<div class="banner ${g.winner}" style="font-size:20px;margin-top:12px"><div class="serif" style="font-size:26px">${g.winner === 'good' ? 'Gana el bien' : 'Gana el mal'}</div><div class="small">${esc(g.winReason)}</div></div>
        ${g.assassinTarget ? `<div class="center muted small" style="margin-top:8px">El Asesino eligió a ${nameOf(g.assassinTarget)}</div>` : ''}`;
      setFab(isHost ? `<button class="btn-gold full" id="again">Volver a la sala</button>` : `<div class="center muted">Esperando al anfitrión…</div>`);
      break;
    }
  }

  const rows = g.order.map((id) => {
    const p = byId[id] || { id, name: '¿?', connected: false };
    let tags = '';
    if (id === g.leader && !['end', 'assassin'].includes(g.phase)) tags += '<span class="tag gold">👑 líder</span>';
    if (g.team.includes(id) && (g.phase === 'vote' || g.phase === 'quest')) tags += '<span class="tag">⚔ equipo</span>';
    if (g.phase === 'vote' && g.votedIds.includes(id)) tags += '<span class="tag">votó</span>';
    if (g.phase === 'quest' && g.playedIds.includes(id)) tags += '<span class="tag">jugó</span>';
    if (g.phase === 'end') {
      const r = g.roles[id]; const evil = ['assassin', 'morgana', 'mordred', 'oberon', 'minion'].includes(r);
      tags += `<span class="tag ${evil ? 'evil' : 'good'}">${ROLE_NAMES[r]}</span>`;
    }
    let cls = '';
    const canPick = (listMode === 'team') || (listMode === 'assassin' && id !== S.meId && !(g.me.night?.ids || []).includes(id));
    if (canPick) cls += ' clickable';
    if (selected.has(id)) cls += ' sel';
    return playerRow(p, tags, cls);
  }).join('');

  $app.innerHTML = `
    <div class="row" style="align-items:center;margin-bottom:4px"><div class="serif" style="color:var(--gold);font-size:20px">Avalon</div><div class="small muted" style="text-align:right">Sala ${S.code}</div></div>
    ${boardHtml(g)}
    ${lastQuestHtml}
    ${phaseHtml}
    <div class="card"><ul class="players">${rows}</ul></div>
    ${g.phase !== 'end' ? roleHtml(g) : ''}
    ${lastVoteHtml()}
    <details class="card"><summary>Personajes en juego</summary><div class="small" style="margin-top:8px">${Object.entries(g.rolesInPlay).map(([r, c]) => `${ROLE_NAMES[r]}${c > 1 ? ' ×' + c : ''}`).join(' · ')}</div></details>`;

  const role = document.getElementById('role');
  if (role) role.onclick = () => { roleShown = !roleShown; render(); };
  document.querySelectorAll('.players li.clickable').forEach((li) => li.onclick = () => {
    const id = li.dataset.id;
    if (listMode === 'assassin') selected = new Set(selected.has(id) ? [] : [id]);
    else if (selected.has(id)) selected.delete(id);
    else if (selected.size < g.questSizes[g.questIdx]) selected.add(id);
    render();
  });
  document.querySelectorAll('[data-vote]').forEach((b) => b.onclick = () => socket.emit('vote', b.dataset.vote === '1'));
  document.querySelectorAll('[data-card]').forEach((b) => b.onclick = () => socket.emit('questCard', b.dataset.card === '1'));
  const pr = document.getElementById('propose'); if (pr) pr.onclick = () => socket.emit('propose', [...selected]);
  const k = document.getElementById('kill'); if (k) k.onclick = () => socket.emit('assassinate', [...selected][0]);
  const a = document.getElementById('again'); if (a) a.onclick = () => socket.emit('backToLobby');
}

render();
</script>
</body>
</html>
